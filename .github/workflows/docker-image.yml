# Builds the image when a version tag is pushed and publishes it to GitHub Container Registry
#   git tag v1.3.0 && git push origin v1.3.0
# Result: ghcr.io/<owner>/cyberghostvpn:v1.3.0 and :latest

name: cyberghostvpn

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN can push to the repository owner's GHCR namespace. No secrets to configure
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which GHCR requires
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      # The CyberGhost CLI binary is x86_64 only
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: buildtime_script_version=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
